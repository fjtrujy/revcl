name: VCL byte-exact build

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vcl-sha256:
    name: Rebuild VCL 1.4 beta 7 and verify SHA-256
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install historical RPM extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm2cpio cpio curl ca-certificates

      - name: Cache historical RPM downloads
        uses: actions/cache@v6
        with:
          path: tools/rh9/rpms
          key: rh9-rpms-${{ hashFiles('tools/rh9/rpms.sha256') }}

      - name: Download, authenticate and extract original RPMs and i686 glibc update
        run: bash scripts/ci/bootstrap_rh9.sh

      - name: Build original GCC 3.2.2-5 toolchain image
        run: |
          docker build --platform linux/386 -t revcl-rh9 tools/rh9
          docker run --rm --platform linux/386 revcl-rh9 g++ --version

      - name: Install Python comparison dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run VCL unit tests
        run: python -m unittest discover -s tests/unit -q

      - name: Recompile and link using original Red Hat toolchain
        run: python scripts/score.py --quiet

      - name: Require exact SHA-256 for native and reconstructed ELF
        run: python scripts/ci/verify_vcl_sha.py

      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcl-byte-exact-failure
          path: |
            tmp/build/score.json
            tmp/build/logs/
            tmp/build/link/ld.log
          if-no-files-found: ignore
