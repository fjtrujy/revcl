name: VCL byte-exact build

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vcl-sha256:
    name: Rebuild VCL 1.4 beta 7 and verify SHA-256
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install historical RPM extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm2cpio cpio curl ca-certificates

      - name: Cache historical RPM downloads
        uses: actions/cache@v6
        with:
          path: tools/rh9/rpms
          key: rh9-rpms-${{ hashFiles('tools/rh9/rpms.sha256') }}

      - name: Download, authenticate and extract original RPMs and i686 glibc update
        run: bash scripts/ci/bootstrap_rh9.sh

      - name: Build original GCC 3.2.2-5 toolchain image
        run: |
          docker build --platform linux/386 -t revcl-rh9 tools/rh9
          docker run --rm --platform linux/386 revcl-rh9 g++ --version
          docker run --rm --platform linux/386 revcl-rh9 make --version

      - name: Compile and link VCL with the historical GNU Make and GCC
        run: |
          docker run --rm --platform linux/386 \
            --mount type=bind,src="$PWD",dst=/work \
            -w /work revcl-rh9 make -j2

      - name: Verify native stripped ELF SHA-256 on the host
        run: make verify-sha

      - name: Preserve native ELF artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcl-native-build-failure
          path: |
            tmp/native/vcl
            tmp/native/vcl.stripped
          if-no-files-found: ignore
