name: VCL modern compilers and tests

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naming-progress:
    name: Verify naming-progress snapshot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify naming inventories and progress
        run: sh scripts/ci/naming-progress.sh --check

  native:
    name: ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.compiler }} + tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Linux, arch: x86_64, compiler: GCC, runner: ubuntu-24.04, preset: linux-gcc, artifact: vcl-native-linux-x86_64-gcc}
          - {platform: Linux, arch: x86_64, compiler: Clang, runner: ubuntu-24.04, preset: linux-clang, artifact: vcl-native-linux-x86_64-clang}
          - {platform: Linux, arch: aarch64, compiler: GCC, runner: ubuntu-24.04-arm, preset: linux-gcc, artifact: vcl-native-linux-arm64-gcc}
          - {platform: Linux, arch: aarch64, compiler: Clang, runner: ubuntu-24.04-arm, preset: linux-clang, artifact: vcl-native-linux-arm64-clang}
          - {platform: macOS, arch: arm64, compiler: Apple-Clang, runner: macos-15, preset: macos, artifact: vcl-native-macos-arm64}
          - {platform: macOS, arch: x86_64, compiler: Apple-Clang, runner: macos-15-intel, preset: macos, artifact: vcl-native-macos-x86_64}

    steps:
      - uses: actions/checkout@v7

      - name: Configure and build native VCL
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          cmake --version
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --parallel "$(sh scripts/ci/cpu-count.sh)"
          file tmp/cmake/${{ matrix.preset }}/vcl

      - name: Run Python-free CTest checks in parallel
        run: ctest --preset ${{ matrix.preset }} --parallel "$(sh scripts/ci/cpu-count.sh)" --output-on-failure

      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: tmp/cmake/${{ matrix.preset }}/vcl
          if-no-files-found: error
